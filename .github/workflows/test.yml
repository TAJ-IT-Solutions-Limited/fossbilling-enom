name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    name: Recorded Enom responses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and recorded responses
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-xml
          php -l src/library/Registrar/Adapter/Enom.php
          php tests/EnomParseTest.php
