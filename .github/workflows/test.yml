name: test

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l src/library/Registrar/Adapter/Enom.php
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: php tests/EnomParseTest.php
